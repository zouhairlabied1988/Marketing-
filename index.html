<style>
  :root {
    --bg: #0A0A0F;
    --bg2: #0D0D18;
    --bg3: #13131F;
    --border: #1E1E30;
    --border2: #2A2A40;
    --text: #E8E8F0;
    --text2: #8888AA;
    --text3: #5A5A80;
    --accent: #6C5CE7;
    --accent2: #A29BFE;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; }

  /* ── SCREENS ── */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; transition: transform 0.32s cubic-bezier(.4,0,.2,1), opacity 0.32s; }
  .screen.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }
  .screen.slide-left { transform: translateX(-30%); opacity: 0; pointer-events: none; }

  /* ── STATUS BAR SPACER ── */
  .status-bar { height: calc(var(--safe-top) + 44px); background: var(--bg2); flex-shrink: 0; display: flex; align-items: flex-end; padding: 0 16px 10px; border-bottom: 1px solid var(--border); }

  /* ── HOME SCREEN ── */
  #home .status-bar { background: linear-gradient(180deg, #0F0F1A, var(--bg2)); }
  .home-header { padding: 20px 20px 16px; flex-shrink: 0; }
  .home-label { font-size: 10px; color: var(--text3); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; }
  .home-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: #fff; line-height: 1.1; }
  .home-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }

  .search-wrap { padding: 0 16px 14px; flex-shrink: 0; }
  .search-box { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 11px 16px 11px 40px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; position: relative; }
  .search-icon { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }
  .search-container { position: relative; }

  /* README pill */
  .readme-pill { margin: 0 16px 16px; background: linear-gradient(135deg, #1A1A2E, #2A1A3E); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; flex-shrink: 0; }
  .readme-pill-icon { font-size: 24px; }
  .readme-pill-text { flex: 1; }
  .readme-pill-title { font-size: 13px; font-weight: 600; color: var(--accent2); }
  .readme-pill-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }
  .readme-pill-arrow { color: var(--accent); font-size: 14px; }

  /* Folder list */
  .folder-list { flex: 1; overflow-y: auto; padding: 0 16px 80px; -webkit-overflow-scrolling: touch; }
  .folder-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s; active-opacity: 0.7; }
  .folder-card:active { opacity: 0.7; transform: scale(0.98); }
  .folder-icon-wrap { width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .folder-info { flex: 1; min-width: 0; }
  .folder-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder-desc { font-size: 10px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder-badge { font-size: 10px; border-radius: 6px; padding: 2px 8px; flex-shrink: 0; font-weight: 600; }
  .folder-arrow { color: var(--text3); font-size: 12px; margin-left: 4px; }

  /* ── FOLDER SCREEN ── */
  #folder .status-bar { gap: 10px; }
  .back-btn { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; padding: 2px 6px; font-family: inherit; }
  .nav-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .folder-content { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .section-label { font-size: 10px; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; margin-top: 4px; }

  .file-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .file-card:active { opacity: 0.7; }
  .file-type-icon { font-size: 24px; width: 40px; text-align: center; flex-shrink: 0; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .file-tag { display: inline-block; font-size: 9px; border-radius: 4px; padding: 2px 6px; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .file-arrow { color: var(--text3); font-size: 12px; }

  /* Client subfolder */
  .client-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .client-header { padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .client-header:active { opacity: 0.7; }
  .client-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
  .client-chevron { color: var(--text3); font-size: 12px; transition: transform 0.2s; }
  .client-chevron.open { transform: rotate(90deg); }
  .client-body { padding: 0 16px 14px; border-top: 1px solid var(--border); display: none; }
  .client-body.open { display: block; }
  .subfolder-chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0; }
  .chip { font-size: 10px; padding: 4px 10px; border-radius: 6px; font-weight: 600; }
  .client-readme { background: var(--bg3); border-radius: 8px; padding: 12px; font-size: 11px; color: var(--text3); line-height: 1.6; white-space: pre-wrap; margin-top: 6px; }

  /* ── FILE SCREEN ── */
  #file .status-bar { gap: 10px; }
  .file-header-info { flex: 1; min-width: 0; }
  .file-header-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-header-tag { font-size: 9px; border-radius: 4px; padding: 1px 6px; text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; display: inline-block; }

  .copy-btn { background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; color: var(--text2); font-size: 11px; padding: 6px 12px; cursor: pointer; font-family: inherit; flex-shrink: 0; }
  .copy-btn.copied { background: #00b894; border-color: #00b894; color: #fff; }

  .file-body { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .file-content { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; font-size: 12px; line-height: 1.8; color: #C8C8E0; white-space: pre-wrap; font-family: 'IBM Plex Mono', monospace; }

  /* ── BOTTOM NAV ── */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(60px + var(--safe-bot)); background: rgba(13,13,24,0.96); border-top: 1px solid var(--border); display: flex; align-items: flex-start; padding-top: 8px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 200; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 0; }
  .nav-item:active { opacity: 0.6; }
  .nav-icon { font-size: 20px; }
  .nav-label { font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text3); transition: color 0.15s; }
  .nav-item.active .nav-label { color: var(--accent2); }
  .nav-item.active .nav-icon { filter: drop-shadow(0 0 6px var(--accent)); }

  /* ── README SCREEN ── */
  #readme .status-bar { gap: 10px; }
  .readme-body { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .readme-content { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; font-size: 12px; line-height: 1.8; color: #C8C8E0; white-space: pre-wrap; font-family: 'IBM Plex Mono', monospace; }

  /* ── PROMPTS QUICK SCREEN ── */
  .prompt-quick-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .pq-title { font-size: 13px; font-weight: 700; color: var(--accent2); margin-bottom: 6px; }
  .pq-desc { font-size: 11px; color: var(--text3); line-height: 1.6; margin-bottom: 12px; }
  .pq-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 8px; color: #fff; font-size: 11px; padding: 8px 14px; cursor: pointer; font-family: inherit; font-weight: 600; }

  /* Toast */
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #00b894; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 12px; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  @media (min-width: 600px) {
    .screen { max-width: 420px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .bottom-nav { max-width: 420px; left: 50%; transform: translateX(-50%); }
    .toast { bottom: 90px; }
  }
</style>
</head>

  Scale by: 20%, wait 48h before next increase

// File type icons and colors
const FILE_ICONS = { prompt:"🤖", template:"📐", guide:"📖", checklist:"✅", csv:"📊", readme:"📝", log:"🗂️", sop:"⚙️", bank:"💡", default:"📄" };
const FILE_COLORS = { prompt:"#FD79A8", template:"#74B9FF", guide:"#55EFC4", checklist:"#00CEC9", csv:"#00CEC9", readme:"#A29BFE", log:"#FF7675", sop:"#6C5CE7", bank:"#E17055" };

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let currentFolder = null;
let currentFile = null;
let currentNav = 'folders';

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  renderFolderList(FOLDERS);
  renderPrompts();
  renderSOPs();
  document.getElementById('readmeContent').textContent = README_TEXT;
  updateClock();
  setInterval(updateClock, 60000);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
});

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}

// ══════════════════════════════════════
// RENDER FOLDER LIST
// ══════════════════════════════════════
function renderFolderList(folders) {
  const list = document.getElementById('folderList');
  list.innerHTML = '';
  folders.forEach(f => {
    const card = document.createElement('div');
    card.className = 'folder-card';
    const count = (f.files?.length||0) + (f.subfolders?.length||0);
    card.innerHTML = `
      <div class="folder-icon-wrap" style="background:${f.color}22">${f.icon}</div>
      <div class="folder-info">
        <div class="folder-name">${f.name}</div>
        <div class="folder-desc">${f.desc}</div>
      </div>
      <span class="folder-badge" style="color:${f.color};background:${f.color}22">${count}</span>
      <span class="folder-arrow">›</span>`;
    card.onclick = () => openFolder(f);
    list.appendChild(card);
  });
}

function filterFolders(q) {
  if (!q) { renderFolderList(FOLDERS); return; }
  const lq = q.toLowerCase();
  const filtered = FOLDERS.filter(f =>
    f.name.toLowerCase().includes(lq) ||
    f.desc.toLowerCase().includes(lq) ||
    f.files?.some(fi => fi.name.toLowerCase().includes(lq))
  );
  renderFolderList(filtered);
}

// ══════════════════════════════════════
// OPEN FOLDER
// ══════════════════════════════════════
function openFolder(folder) {
  currentFolder = folder;
  document.getElementById('folderTitle').textContent = folder.name;
  const content = document.getElementById('folderContent');
  content.innerHTML = '';

  // Files section
  if (folder.files?.length) {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = 'Files';
    content.appendChild(label);

    folder.files.forEach(file => {
      const card = document.createElement('div');
      card.className = 'file-card';
      const icon = FILE_ICONS[file.type] || FILE_ICONS.default;
      const color = FILE_COLORS[file.type] || '#888';
      card.innerHTML = `
        <div class="file-type-icon">${icon}</div>
        <div class="file-info">
          <div class="file-name">${file.name}</div>
          <span class="file-tag" style="color:${color};background:${color}22">${file.type||'txt'}</span>
        </div>
        <span class="file-arrow">›</span>`;
      card.onclick = () => openFile(file, folder.color);
      content.appendChild(card);
    });
  }

  // Client subfolders
  if (folder.subfolders?.length) {
    const label2 = document.createElement('div');
    label2.className = 'section-label';
    label2.style.marginTop = '16px';
    label2.textContent = 'Client Folders';
    content.appendChild(label2);

    folder.subfolders.forEach(client => {
      const card = document.createElement('div');
      card.className = 'client-card';
      const bodyId = 'client_' + client.name.replace(/\s/g,'_');
      card.innerHTML = `
        <div class="client-header" onclick="toggleClient('${bodyId}',this)">
          <span style="font-size:22px">${client.icon}</span>
          <span class="client-name">${client.name}</span>
          <span class="client-chevron" id="chev_${bodyId}">›</span>
        </div>
        <div class="client-body" id="${bodyId}">
          <div class="subfolder-chips">${client.subs.map(s=>`<span class="chip" style="color:${folder.color};background:${folder.color}22">📁 ${s}</span>`).join('')}</div>
          <div class="client-readme">${client.readme}</div>
        </div>`;
      content.appendChild(card);
    });
  }

  // Bottom padding
  const pad = document.createElement('div');
  pad.style.height = '80px';
  content.appendChild(pad);

  showScreen('folder');
  document.getElementById('folder').querySelector('.folder-content').scrollTop = 0;
}

function toggleClient(id, header) {
  const body = document.getElementById(id);
  const chev = document.getElementById('chev_' + id);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.style.transform = isOpen ? '' : 'rotate(90deg)';
}

// ══════════════════════════════════════
// OPEN FILE
// ══════════════════════════════════════
function openFile(file, accentColor) {
  currentFile = file;
  document.getElementById('fileTitle').textContent = file.name;
  const tag = document.getElementById('fileTag');
  const color = FILE_COLORS[file.type] || '#888';
  tag.textContent = file.type || 'txt';
  tag.style.color = color;
  tag.style.background = color + '22';
  document.getElementById('fileContent').textContent = file.content;
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.classList.remove('copied');
  copyBtn.textContent = 'Copy';
  showScreen('file');
  document.getElementById('file').querySelector('.file-body').scrollTop = 0;
}

function copyFile() {
  if (!currentFile) return;
  navigator.clipboard.writeText(currentFile.content).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓';
    btn.classList.add('copied');
    showToast();
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function copyReadme() {
  navigator.clipboard.writeText(README_TEXT).then(() => showToast());
}

// ══════════════════════════════════════
// PROMPTS QUICK VIEW
// ══════════════════════════════════════
function renderPrompts() {
  const promptFolder = FOLDERS.find(f => f.id === '12');
  const container = document.getElementById('promptsContent');
  container.innerHTML = '<div class="section-label">Quick Access — All Claude Prompts</div>';

  promptFolder.files.forEach(file => {
    const card = document.createElement('div');
    card.className = 'prompt-quick-card';
    const preview = file.content.split('\n').slice(0,3).join(' ').substring(0, 120) + '...';
    card.innerHTML = `
      <div class="pq-title">🤖 ${file.name}</div>
      <div class="pq-desc">${preview}</div>
      <button class="pq-btn" onclick="openFileFromPrompts(${JSON.stringify(file).replace(/"/g,'&quot;')})">Open & Copy</button>`;
    container.appendChild(card);
  });

  const pad = document.createElement('div');
  pad.style.height = '80px';
  container.appendChild(pad);
}

function openFileFromPrompts(file) {
  // Parse if passed as string
  const f = typeof file === 'string' ? JSON.parse(file.replace(/&quot;/g,'"')) : file;
  openFile(f, '#FD79A8');
}

// ══════════════════════════════════════
// SOPs QUICK VIEW
// ══════════════════════════════════════
function renderSOPs() {
  const sopsFolder = FOLDERS.find(f => f.id === '13');
  const container = document.getElementById('sopsContent');
  container.innerHTML = '<div class="section-label">Quick Access — SOPs & Checklists</div>';

  sopsFolder.files.forEach(file => {
    const card = document.createElement('div');
    card.className = 'file-card';
    card.style.marginBottom = '10px';
    card.innerHTML = `
      <div class="file-type-icon">✅</div>
      <div class="file-info">
        <div class="file-name">${file.name}</div>
        <span class="file-tag" style="color:#55EFC4;background:#55EFC422">${file.type}</span>
      </div>
      <span class="file-arrow">›</span>`;
    card.onclick = () => openFile(file, '#55EFC4');
    container.appendChild(card);
  });

  const pad = document.createElement('div');
  pad.style.height = '80px';
  container.appendChild(pad);
}

// ══════════════════════════════════════
// README
// ══════════════════════════════════════
function openReadme() {
  showScreen('readme');
  setActiveNav('readme-nav');
  document.getElementById('readme').querySelector('.readme-body').scrollTop = 0;
}

// ══════════════════════════════════════
// NAV & SCREENS
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.add('hidden');
    s.classList.remove('slide-left');
  });
  document.getElementById(id).classList.remove('hidden');
}

function goBack(fromId, toId) {
  document.getElementById(fromId).classList.add('hidden');
  document.getElementById(toId).classList.remove('hidden');
}

function navTo(screenId, navKey) {
  showScreen(screenId);
  setActiveNav(navKey);
}

function setActiveNav(key) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  currentNav = key;
  const map = { folders:'nav-folders', prompts:'nav-prompts', sops:'nav-sops', 'readme-nav':'nav-readme' };
  const el = document.getElementById(map[key]);
  if (el) el.classList.add('active');
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
